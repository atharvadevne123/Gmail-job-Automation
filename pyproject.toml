[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-job-automation"
version = "1.0.0"
description = "Automated job application tracking via Gmail"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "atharvadevne123", email = "devneatharva@gmail.com"}]

[project.urls]
Homepage = "https://github.com/atharvadevne123/Gmail-job-Automation"
Issues = "https://github.com/atharvadevne123/Gmail-job-Automation/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]

[project.scripts]
label-jobs = "gmail_labeler:main"
label-interviews = "label_interviews:main"
delete-job-emails = "delete_job_emails:main"
count-emails = "count_emails:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", "scripts/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]