[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-job-automation"
version = "1.0.0"
description = "Automated job application tracking via Gmail"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "atharvadevne123", email = "devneatharva@gmail.com"}]

[project.urls]
Homepage = "https://github.com/atharvadevne123/Gmail-job-Automation"
Issues = "https://github.com/atharvadevne123/Gmail-job-Automation/issues"

[project.scripts]
count-emails = "count_emails:main"
label-jobs = "gmail_labeler:main"
label-interviews = "label_interviews:main"
delete-job-emails = "delete_job_emails:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", ".venv/*", "conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
